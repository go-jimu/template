logger:
  level: info
  output: console
eventbus:
  # buffer-size, workers, and handler-timeout run the best-effort handlers.
  buffer-size: 1024
  workers: 4
  handler-timeout: 10s
  # The Relay of the must-run handlers. Its workers hold MySQL connections, so
  # mysql.max_open_conns leaves room for them beside request traffic.
  outbox:
    # Names this instance in record leases; empty means the hostname, which
    # is the pod name in Kubernetes.
    owner: ${OUTBOX_OWNER:}
    # Above the slowest record's run time, or a second Relay reruns it.
    lease: 1m
    poll-interval: 5s
    workers: 4
    batch-size: 32
    min-backoff: 1s
    max-backoff: 5m
    # How long completed records stay before the Relay purges them.
    retention: 168h
kafka:
  brokers:
    - ${KAFKA_BROKER:localhost:9092}
  client-id: ${KAFKA_CLIENT_ID:go-jimu-template}
  consumer-group: ${KAFKA_CONSUMER_GROUP:go-jimu-template}
  topics:
    - user.integration.v1.UserRegisteredV1
  # retry handles a failed message again in place, after a backoff, and drops
  # it after 3 attempts; drop commits it and moves on at once.
  failure-policy: ${KAFKA_FAILURE_POLICY:retry}
  # A batch must end within the 60s rebalance timeout:
  # max-poll-records × handler-timeout stays below it.
  handler-timeout: ${KAFKA_HANDLER_TIMEOUT:5s}
  max-poll-records: 10
mysql:
  host: ${MYSQL_HOST:localhost}
  port: ${MYSQL_PORT:3306}
  user: ${MYSQL_USER:root}
  password: ${MYSQL_PASSWORD:jimu}
  database: ${MYSQL_DATABASE:jimu}
  max_open_conns: 12
  max_idle_conns: 12
  max_idle_time: ${MYSQL_MAX_IDLE_TIME:5m}
  max_lifetime: ${MYSQL_MAX_LIFETIME:30m}
connect:
  # Serves every contract; the gateway's routes decide which leave the
  # deployment.
  addr: "${CONNECT_ADDR::8080}"
  # On shutdown the server reports NOT_SERVING for readiness and keeps serving this
  # long before closing, so load balancers stop routing first.
  shutdown-delay: ${CONNECT_SHUTDOWN_DELAY:5s}
