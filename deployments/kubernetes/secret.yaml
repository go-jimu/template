# The server's whole configuration. Mounted at /app/configs/server, its
# defaults.yml replaces the one baked into the image. It is a Secret because it holds the
# MySQL password; the values below are placeholders. Create the real Secret
# outside the repository, for example with an external secret operator or
#   kubectl create secret generic template-config --from-file=defaults.yml
# The server reads it once at start: roll the Deployment after changing it.
apiVersion: v1
kind: Secret
metadata:
  name: template-config
  labels:
    app.kubernetes.io/name: template
type: Opaque
stringData:
  defaults.yml: |
    logger:
      level: info
      output: console
    eventbus:
      buffer-size: 1024
      workers: 4
      delay-close: 1s
      handler-timeout: 10s
    kafka:
      brokers:
        - kafka:9092
      client-id: template
      consumer-group: template
      topics:
        - user.integration.v1.UserRegisteredV1
      failure-policy: retry
      handler-timeout: 5s
      max-poll-records: 10
    mysql:
      host: mysql
      port: 3306
      user: template
      password: change-me
      database: template
      max_open_conns: 12
      max_idle_conns: 12
      max_idle_time: 5m
      max_lifetime: 30m
    connect:
      addr: ":8080"
      shutdown-delay: 5s
